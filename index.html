<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />

    <!-- Basic SEO -->
    <title>Weatherly</title>
    <meta
      name="description"
      content="Weatherly — a weather forecast app with current conditions, hourly and weekly forecasts, air quality, and sun & moon data."
    />
    <meta name="keywords" content="weather app, weather forecast, forecast, air quality, weather radar, weatherly" />
    <meta name="author" content="Andrii" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme -->
    <meta name="theme-color" content="#f0f2f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e11" media="(prefers-color-scheme: dark)" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://weatherly-forecast.vercel.app" />

    <!-- Open Graph (Facebook, Discord, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Weatherly" />
    <meta property="og:description" content="Check current weather, hourly forecasts, air quality, and more with Weatherly." />
    <meta property="og:url" content="https://weatherly-forecast.vercel.app" />
    <meta property="og:image" content="https://weatherly-forecast.vercel.app/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Weatherly Application Preview" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Weatherly" />
    <meta name="twitter:description" content="Check current weather, hourly forecasts, air quality, and more with Weatherly." />
    <meta name="twitter:image" content="https://weatherly-forecast.vercel.app/preview.png" />
    <meta name="twitter:image:alt" content="Weatherly Application Preview" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
